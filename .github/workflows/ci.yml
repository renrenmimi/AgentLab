name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: verify and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Content checks first: they fail in seconds and say what is wrong in
      # prose, while a type error from the build says only that a page is red.
      - name: Check the course content
        run: node verify.mjs

      - name: Build
        run: npx next build
